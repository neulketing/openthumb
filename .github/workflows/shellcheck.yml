name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Discover by shebang, not extension: tools/openthumb-fleet has no .sh
      # suffix. Split by ownership rather than picking one severity for both
      # trees — at "error" the only real defect in the fleet script (SC2318,
      # a port computed from the caller's variable) was filtered out, and at
      # "warning" the inherited build scripts drown it in SC2034/SC2154 noise
      # that belongs upstream.
      # The file list is discovered, so the word split below is deliberate —
      # and a path containing a space would silently check the wrong thing.
      # Fail loudly instead of splitting badly.
      - name: Shellcheck (fork-owned tools, strict)
        run: |
          files=$(grep -rlE '^#!.*\b(ba)?sh\b' tools)
          case "$files" in *' '*) echo "space in a path — this step needs -print0"; exit 1;; esac
          # shellcheck disable=SC2086
          shellcheck --severity=warning $files

      - name: Shellcheck (inherited scripts, real breakage only)
        run: |
          files=$(grep -rlE '^#!.*\b(ba)?sh\b' scripts)
          case "$files" in *' '*) echo "space in a path — this step needs -print0"; exit 1;; esac
          # shellcheck disable=SC2086
          shellcheck --severity=error $files

      # Runs against a stub adb, so no phones are needed. Guards the failure
      # mode shellcheck cannot see: a command inside the device loop eating
      # stdin, which truncates the fleet silently rather than erroring.
      - name: Fleet tool smoke test
        run: tools/test-openthumb-fleet.sh
